[project]
name = "fish-labeler"
version = "0.1.0"
description = "Fish Labeler prepares and annotates fish imagery collected aboard fishing vessels."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pyqt6>=6.6.0",
    "rich>=14.3.3",
    "tqdm>=4.67.1",
    "ultralytics>=8.3.237",
]

[project.scripts]
fish-labeler = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/ui"]

[tool.hatch.build.targets.wheel.force-include]
"src/main.py" = "main.py"

[dependency-groups]
dev = [
    "complexipy>=5.4.0",
    "detect-secrets>=1.5.0",
    "docstr-coverage>=2.3.2",
    "ipykernel>=7.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.complexipy]
paths = ["src/"]
max-complexity-allowed = 20
snapshot-create = false
snapshot-ignore = false
quiet = false
ignore-complexity = false
failed = false
color = "auto"
sort = "asc"
exclude = []
output-csv = false
output-json = false
